name: Restore original Project Documentation video
on:
  push:
    branches: [main]
    paths:
      - 'assets/works/project-documentation-parts/**'
      - '.github/workflows/assemble-project-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original MP4 without recompression
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          folder = Path('assets/works/project-documentation-parts')
          parts = sorted(folder.glob('part-*.b64'))
          if len(parts) != 14:
              raise RuntimeError(f'Expected 14 original video transfer parts, got {len(parts)}')
          data = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in parts)
          video = base64.b64decode(data, validate=True)
          expected = 'a112c69c0c0c2c04e773325574de6cb232d20375e239d90fa8ae2e03d91d85e4'
          actual = hashlib.sha256(video).hexdigest()
          if actual != expected:
              raise RuntimeError('Original video SHA-256 mismatch')
          output = Path('assets/works/project-documentation.mp4')
          output.write_bytes(video)
          print(f'Restored {len(video)} bytes to {output} (SHA256 {actual})')
          PY
      - name: Commit the original playable MP4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/works/project-documentation.mp4
          if ! git diff --staged --quiet; then
            git commit -m "Add original Project Documentation MP4 for inline playback"
            git push origin HEAD:main
          fi
