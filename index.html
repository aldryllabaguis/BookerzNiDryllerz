/* Browser-stable 3D stacking, visible page depth and paper shadows. */

.leaf{-webkit-transform-origin:left center;transform-origin:left center;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;will-change:transform}

.face.back{-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:rotateY(180deg) translateZ(.4px);transform:rotateY(180deg) translateZ(.4px);background-image:linear-gradient(270deg,#e6dccc22 0%,#ffffff36 12%,transparent 58%,#4d3d2414 100%);box-shadow:inset -10px 0 17px -9px #332a3040,-2px 1px 4px #221b2220}
.face.cover,.face.bk{background-image:none}

  background:radial-gradient(ellipse,#000e 0%,#0008 38%,transparent 73%)!important;

}
#hint{color:#e1d3bd!important;text-shadow:0 2px 8px #000!important}

@media(max-width:760px){
  body,#flat{background:#171315!important}

/* HAND-PLACED GOTHIC STICKERS — frame the title, never cover it */
.face.cover{position:absolute;isolation:isolate;overflow:hidden}
.face.cover .ct{
  position:absolute!important;z-index:5!important;top:25%!important;left:8%!important;right:8%!important;
  text-align:center!important;padding:12px 5px 16px!important;
  background:linear-gradient(180deg,#281719d9,#281719a8)!important;
  border-top:1px solid #c4a879!important;border-bottom:1px solid #c4a879!important;
  box-shadow:0 8px 22px #10090ab0!important;
}
.face.cover .ct h1{font-size:clamp(2.4rem,5.3vw,4.7rem)!important;line-height:1.08!important;overflow-wrap:normal!important;word-break:normal!important;color:#f3e9d9!important;text-shadow:2px 2px 0 #71332e,0 0 12px #000!important}
.face.cover .ct small{display:block;margin-bottom:8px;font-size:10px}
.face.cover img.cover-sticker{position:absolute!important;display:block!important;z-index:4!important;height:auto!important;max-width:none!important;object-fit:contain!important;opacity:.96!important;mix-blend-mode:normal!important;filter:drop-shadow(2px 4px 2px #000b) drop-shadow(0 0 1px #c6b99e)!important;pointer-events:none!important}
.face.cover img.sticker-cat{width:22%!important;left:3%!important;bottom:8%!important;transform:rotate(-8deg)!important}
.face.cover img.sticker-bat{width:43%!important;right:3%!important;bottom:8%!important;transform:rotate(7deg)!important}
.face.cover img.sticker-skull{width:13%!important;right:8%!important;top:7%!important;transform:rotate(11deg)!important;filter:drop-shadow(2px 3px 2px #000b)!important}
.face.cover .stamp{z-index:6!important;left:28px!important;bottom:22px!important}
@media(max-width:760px){
 .face.cover .ct{top:24%!important}
 .face.cover .ct h1{font-size:clamp(2.1rem,9vw,3.2rem)!important}
 .face.cover img.sticker-cat{width:23%!important}
 .face.cover img.sticker-bat{width:42%!important}
 .face.cover img.sticker-skull{width:14%!important}

/* WHITE GOTHIC SKULL + WHITE COVER NAME */
.face.cover img.sticker-skull{
  filter:brightness(0) invert(1) drop-shadow(2px 3px 2px #000c)!important;
}
.face.cover .ct h1{
  color:#fff!important;
  -webkit-text-fill-color:#fff!important;
  font-family:'UnifrakturCook','IM Fell English',Georgia,serif!important;
  font-weight:700!important;
  text-shadow:2px 2px 0 #382326,0 0 12px #000!important;
}


/* FORCE PURE WHITE NAME — high contrast on the cover */
#book .leaf .face.cover .ct h1,
#flat .face.cover .ct h1{
  color:#ffffff!important;
  -webkit-text-fill-color:#ffffff!important;
  fill:#ffffff!important;
  opacity:1!important;
  filter:none!important;
  mix-blend-mode:normal!important;
  text-shadow:0 2px 3px #000!important;
}

/* TWO-VOLUME NAVIGATION */
#nav{flex-wrap:wrap;justify-content:center;max-width:min(96vw,900px)}
#nav .nav-divider{width:1px;height:24px;background:#b99a63;margin:0 4px}
#nav button[data-book]{background:#211719;color:#f0e5d3;border:1px solid #b99a63;box-shadow:2px 2px 0 #761d2a}
#nav button[data-book][aria-current="page"]{background:#761d2a;color:#fff}
.face.cover .works-subtitle{position:relative;color:#f0e5d3;font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(1rem,2vw,1.4rem);margin-top:14px;text-shadow:0 2px 5px #000}
.face.cover .ct{z-index:3}
.face.cover .ct h1{max-width:100%}
@media(max-width:760px){#nav{display:none}}
