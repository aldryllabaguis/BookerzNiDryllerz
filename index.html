/* Browser-stable 3D stacking, visible page depth and paper shadows. */

.leaf{-webkit-transform-origin:left center;transform-origin:left center;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;will-change:transform}

.face.back{-webkit-backface-visibility:hidden;backface-visibility:hidden;-webkit-transform:rotateY(180deg) translateZ(.4px);transform:rotateY(180deg) translateZ(.4px);background-image:linear-gradient(270deg,#e6dccc22 0%,#ffffff36 12%,transparent 58%,#4d3d2414 100%);box-shadow:inset -10px 0 17px -9px #332a3040,-2px 1px 4px #221b2220}
.face.cover,.face.bk{background-image:none}

books.forEach((b,i)=>{
 const card=document.createElement('button');card.type='button';card.className='showcase-card';card.dataset.bookId=b.id;
 card.innerHTML=`<span class="showcase-card-kicker">${b.subtitle}</span><span class="showcase-object"><span class="showcase-pages"></span><span class="showcase-spine"></span><span class="showcase-cover face cover">${b.cover}</span></span><span class="showcase-card-title">${b.title}</span><span class="showcase-card-author">${b.author} · ${b.year}</span><span class="showcase-open">OPEN BOOK ↗</span>`;
 shelf.append(card);
});
let selected=0,reader=null;
function showBook(index){
 selected=(index+books.length)%books.length;const b=books[selected];
 shelf.hidden=true;detail.hidden=false;
 $('.showcase-reader',detail).innerHTML='';
 reader=makeFlipbook(b.pages,b.title,'featured-volume');
 $('.showcase-reader',detail).append(reader.section);
 $('.showcase-info h2',detail).textContent=b.title;
 $('.showcase-byline',detail).textContent='By '+b.author;
 $('.showcase-description',detail).textContent=b.desc;
 $('.showcase-meta',detail).innerHTML=`<span>${b.subtitle}</span><span>${b.year}</span><span>${b.pages.length/2} page turns</span>`;
 $('.showcase-detail').classList.remove('detail-enter');void $('.showcase-detail').offsetWidth;$('.showcase-detail').classList.add('detail-enter');
}
function backToShelf(){detail.hidden=true;shelf.hidden=false;reader=null}
shelf.addEventListener('click',e=>{const card=e.target.closest('[data-book-id]');if(card)showBook(books.findIndex(b=>b.id===card.dataset.bookId))});
$('.showcase-back',detail).addEventListener('click',backToShelf);
detail.addEventListener('click',e=>{if(e.target.closest('[data-book-prev]'))showBook(selected-1);if(e.target.closest('[data-book-next]'))showBook(selected+1)});
$('#nav').style.display='none';$('#flat').innerHTML='';$('#hint').textContent='';
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(!detail.hidden&&reader){if(e.key==='ArrowRight'){e.preventDefault();reader.go(999)}else if(e.key==='ArrowLeft'){e.preventDefault();reader.go(-1)}else if(e.key==='Escape')backToShelf()}});

 </script></body></html>
