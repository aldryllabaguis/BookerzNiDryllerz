<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--navy:#11182f;--navy2:#0a1022;--paper:#e9ddcb;--ink:#241c20;--gold:#b9a17d;--rose:#e8a7b9}
*{box-sizing:border-box}
html{min-height:100%;background:var(--navy2)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 52% 47%,#1d2747 0%,#131c37 55%,#080e1d 100%);color:#f0e7de;font-family:'Cormorant Garamond',Georgia,serif}
button{font:inherit}
button:focus-visible{outline:2px solid #dec2a3;outline-offset:5px}
[hidden]{display:none!important}
#showcase{min-height:100vh;width:min(1300px,100%);margin:auto;padding:24px clamp(18px,4vw,60px) 40px}
.scene{position:relative;min-height:min(700px,85vh)}
.shelf-view{transition:opacity .55s ease,transform .7s cubic-bezier(.19,1,.22,1);opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.scene.is-detail .shelf-view,.scene.is-reading .shelf-view{opacity:0;transform:translateY(25px) scale(.94);pointer-events:none}
.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:20px;font:11px 'Special Elite',monospace;color:#c8c4d5;letter-spacing:.13em}
.shelf-title{text-align:center;margin:32px auto 34px}
.shelf-title .eyebrow{font:10px 'Special Elite',monospace;letter-spacing:.2em;color:#c6bfd1}
.shelf-title h1{font:500 clamp(2.8rem,6vw,5.3rem)/1.05 'IM Fell English',Georgia,serif;color:#f5e9de;margin:11px 0 10px;text-shadow:0 4px 20px #03050d50}
.shelf-title p{color:#c4bfcc;font-size:18px;margin:0}
.shelf-track{display:flex;justify-content:center;align-items:center;gap:clamp(28px,8vw,112px);padding:8px 10px 15px;perspective:1350px;min-height:380px}
.shelf-book{background:transparent;border:0;padding:0;margin:0;width:clamp(195px,23vw,250px);flex:0 1 auto;min-width:0;color:inherit;display:flex;align-items:center;flex-direction:column;cursor:pointer;position:relative;transform-style:preserve-3d}
.shelf-book:hover,.shelf-book:focus-visible{background:transparent}
.shelf-book .book-3d{position:relative;display:block;width:clamp(168px,20vw,220px);height:clamp(250px,29.5vw,324px);transform-style:preserve-3d;transform:rotateY(-12deg) rotateZ(-5deg);transition:transform .68s cubic-bezier(.2,.8,.15,1),filter .68s;filter:drop-shadow(16px 20px 11px #02050bc0)}
.shelf-book:nth-child(2) .book-3d{transform:rotateY(10deg) rotateZ(5deg)}
.shelf-book:hover .book-3d,.shelf-book:focus-visible .book-3d{transform:translateY(-22px) rotateY(-28deg) rotateZ(-2deg) scale(1.05);filter:drop-shadow(24px 30px 18px #03040bd9)}
.shelf-book:nth-child(2):hover .book-3d,.shelf-book:nth-child(2):focus-visible .book-3d{transform:translateY(-22px) rotateY(28deg) rotateZ(2deg) scale(1.05)}
.shelf-book .book-3d::before,.shelf-book .book-3d::after{content:none}
.book-spine{position:absolute;left:-12px;top:1%;width:13px;height:98%;background:linear-gradient(90deg,#120d10,#6b4039 46%,#2c1a20);border-radius:2px 0 0 2px;transform:translateZ(-4px);box-shadow:inset 1px 0 2px #000b}
.book-edge{position:absolute;inset:4px -6px 4px 7px;background:repeating-linear-gradient(180deg,#f2e8d7 0 2px,#ccbba0 2px 3px);border-right:2px solid #9f866d;transform:translateZ(-6px)}
.display-cover{position:absolute;inset:0;display:block;overflow:hidden;border:3px double var(--gold);background:radial-gradient(ellipse at 45% 35%,#453032,#241a22 64%,#120f15);box-shadow:inset 0 0 0 5px #21161a,inset 0 0 0 7px #8d7358;transform:translateZ(3px);backface-visibility:hidden}
.display-cover .sun,.display-cover>img:not(.cover-sticker){display:none!important}
.display-cover .ct{position:absolute;top:24%;left:6%;right:6%;text-align:center;z-index:5;background:linear-gradient(#241417e0,#241417c5);border-top:1px solid #ad8d64;border-bottom:1px solid #ad8d64;padding:8px 2px 12px}
.display-cover .ct small{display:block;color:#dcc3a3;font:8px/1.45 'Special Elite',monospace;letter-spacing:.09em}
.display-cover .ct h1{font:700 clamp(1.5rem,2.7vw,2.5rem)/1.08 'UnifrakturCook',Georgia,serif;letter-spacing:0;overflow-wrap:anywhere;color:white;margin:8px 0 0;text-shadow:0 2px 4px #000}
.display-cover .works-subtitle{font:12px/1.15 'Cormorant Garamond',serif;color:#efe3d4;margin:8px 0 0}
.display-cover img.cover-sticker{position:absolute;display:block;height:auto;object-fit:contain;pointer-events:none;z-index:3;max-width:none}

.shelf-book-title{color:#f2e6dc;font:italic 22px 'IM Fell English',Georgia,serif;margin-top:22px;line-height:1.1}

.shelf-footer{display:flex;align-items:center;justify-content:space-between;margin:22px auto 0;max-width:760px;color:#aaa9bf;font:11px 'Special Elite',monospace;letter-spacing:.1em;gap:20px}
.shelf-nav{display:flex;align-items:center;gap:12px}

.detail-view{position:absolute;inset:0;visibility:hidden;opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1),visibility .6s}

.detail-grid{min-height:580px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);align-items:center;gap:clamp(20px,4vw,64px);padding-top:58px}
.focus-stage{display:grid;place-items:center;min-height:450px;perspective:1600px}

.detail-text p{color:#d3cddd;font:19px/1.5 'Cormorant Garamond',Georgia,serif;max-width:460px;margin:0 0 18px}
.detail-by{font:11px 'Special Elite',monospace!important;color:#ccc7d5!important;margin-bottom:16px!important}
.detail-meta{display:flex;gap:16px;align-items:center;margin:20px 0 28px;font:11px 'Special Elite',monospace;color:#c9c6d2}
.detail-meta span{padding-right:16px;border-right:1px solid #5f6782}

.action{border:1px solid #9799b4;background:#e7e3ec;color:#1c263f;border-radius:99px;padding:12px 21px;cursor:pointer;font:11px 'Special Elite',monospace;transition:background .2s,transform .2s}
.action:hover{background:#f2bbc9;transform:translateY(-2px)}
.action.secondary{background:#2e3a63;color:#f1eaf5}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
.detail-nav{display:flex;align-items:center;gap:15px;color:#bcb9cc;font:10px 'Special Elite',monospace}
.reader-view{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none;transform:translateY(20px);transition:opacity .55s,transform .55s,visibility .55s}
.scene.is-reading .reader-view{visibility:visible;opacity:1;pointer-events:auto;transform:translateY(0)}
.reader-top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px auto 16px;max-width:860px}
.reader-top h2{font:italic 29px 'IM Fell English',serif;margin:0;color:#f1e4d5}
.reader-top button{border:1px solid #8994b2;background:#192440;color:#eee2d7;border-radius:20px;padding:8px 12px;cursor:pointer;font:11px 'Special Elite',monospace}
.reader-stage{position:relative;width:min(850px,100%);height:clamp(430px,51vw,550px);margin:auto;perspective:1700px;touch-action:pan-y;user-select:none}
.reader-pages{position:absolute;inset:0;transform-style:preserve-3d;perspective:1700px;transition:none;filter:drop-shadow(0 16px 20px #0009)}
.reader-pages::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#d6c3a6,#f1e7d4 48%,#665144 50%,#f1e6d4 52%,#c4ae8d);opacity:var(--spread,0);pointer-events:none}
.reader-leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;will-change:transform}
.page-face{position:absolute;inset:0;backface-visibility:hidden;overflow-y:auto;overflow-x:hidden;padding:clamp(14px,2.4vw,28px);border:1px solid #b7a187;background:#eee2cf;color:#34272a;box-shadow:inset 9px 0 17px -7px #4d35232a;font:clamp(13px,1.5vw,17px)/1.45 'Cormorant Garamond',Georgia,serif}

.page-face h2{font:italic clamp(24px,3vw,36px)/1.08 'IM Fell English',serif;color:#543139;margin:0 0 12px}
.page-face h3{font:600 clamp(16px,1.7vw,21px)/1.1 'IM Fell English',serif;margin:0 0 3px;color:#6d4649}

.page-face .lead{font-size:1.05em}
.page-face .edit{color:#825567}
.page-face a{color:#713f44;overflow-wrap:anywhere}
.page-face ol{padding:0;list-style:none}

.page-face .num{font:italic 3rem Georgia,serif;color:#a48c72;float:right}
.page-face .pn{margin-top:10px;text-align:center;color:#876d5e;font:10px 'Special Elite',monospace}
.page-face .pola{width:68%;max-width:210px;background:#f9f2e5;border:5px solid #f9f2e5;box-shadow:3px 4px 7px #0004;transform:rotate(-3deg)}
.page-face .ph{aspect-ratio:1;display:grid;place-items:center;background:#b5a28d;font:700 3rem Georgia,serif;overflow:hidden;position:relative}
.page-face .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.page-face .stats{display:flex;gap:18px;margin-top:13px}.page-face .stats b{display:block;font-size:1.6rem}
.page-face .toc{display:flex;flex-direction:column;align-items:start;gap:7px}.page-face .toc button{background:#473239;color:#fff;border:0;padding:7px 12px;cursor:pointer;font:11px 'Special Elite',monospace}
.page-face.cover{background:radial-gradient(ellipse at 48% 36%,#493134,#24191f 70%,#151015);border:4px double #bba380;color:#fff;overflow:hidden}
.page-face.cover .sun,.page-face.cover>img:not(.cover-sticker){display:none}
.page-face.cover .ct{position:absolute;top:25%;left:6%;right:6%;background:#271b20cf;text-align:center;padding:9px 3px;border-top:1px solid #ae9676;border-bottom:1px solid #ae9676}
.page-face.cover .ct h1{font:700 clamp(1.9rem,3.8vw,3.5rem)/1.07 'UnifrakturCook',serif;color:white;margin:7px 0;overflow-wrap:anywhere}
.page-face.cover .ct small{font:9px 'Special Elite',monospace;color:#e1d0b5}
.page-face.cover .works-subtitle{font-size:15px}
.page-face.cover .cover-sticker{position:absolute;max-width:none;height:auto}
.page-face.cover .sticker-cat{width:22%;left:6%;bottom:9%}.page-face.cover .sticker-bat{width:42%;right:5%;bottom:8%}.page-face.cover .sticker-skull{width:13%;right:6%;top:7%;filter:brightness(0) invert(1)}
.page-face.cover .stamp{position:absolute;left:8%;bottom:7%;border:1px solid #ae9676;padding:5px 8px;background:#251a1b;font:9px 'Special Elite',monospace;transform:rotate(-6deg)}
.page-face.bk{display:grid;place-items:center;background:#2c2025;color:#f6e7dc}

 #showcase{padding:22px 14px}.shelf-track{gap:clamp(8px,4vw,40px);min-height:320px}.shelf-book{width:46%}.shelf-book .book-3d{width:clamp(135px,32vw,200px);height:clamp(210px,46vw,290px)}.display-cover .ct h1{font-size:clamp(1.35rem,3.7vw,2rem)}.shelf-title{margin:24px auto 20px}.detail-grid{grid-template-columns:1fr;padding-top:40px;gap:0}.focus-stage{min-height:355px}.focus-book{width:205px;height:292px}.detail-text{max-width:560px;margin:0 auto}.detail-text h2{font-size:2.8rem}.detail-text p{font-size:17px}.detail-view,.reader-view{position:relative;inset:auto}.scene{min-height:670px}.scene.is-detail .shelf-view,.scene.is-reading .shelf-view{display:none}.close-detail{top:0}.focus-inside h3{margin:18px 0 12px;font-size:29px}.focus-inside li{padding:6px 0}.focus-back small{margin-top:75px}

 .shelf-book .book-3d{width:clamp(122px,34vw,150px);height:clamp(190px,50vw,229px)}.shelf-track{gap:7px}.shelf-book-title{font-size:18px}.shelf-book-sub{font-size:8px}.shelf-title h1{font-size:2.6rem}.shelf-footer{font-size:9px}.display-cover .ct h1{font-size:1.22rem}.display-cover .stamp{font-size:6px}.reader-stage{height:370px}.page-face{padding:10px;font-size:12px}.page-face h2{font-size:21px}.page-face.cover .ct h1{font-size:1.7rem}

/* Three independent volumes — the bookshelf wraps gracefully at narrow widths. */
.shelf-track{gap:clamp(20px,4vw,58px);padding-inline:0}
.shelf-book{width:clamp(170px,21vw,235px)}
.shelf-book .book-3d{width:clamp(150px,17.5vw,205px);height:clamp(235px,26vw,309px)}
.shelf-book:nth-child(3) .book-3d{transform:rotateY(-10deg) rotateZ(-3deg)}
.shelf-book:nth-child(3):hover .book-3d,.shelf-book:nth-child(3):focus-visible .book-3d{transform:translateY(-22px) rotateY(-25deg) rotateZ(-1deg) scale(1.05)}
@media(max-width:790px){
 .shelf-track{flex-wrap:wrap;justify-content:center;gap:25px 18px}
 .shelf-book{width:min(44%,220px);flex:0 1 44%}
 .shelf-book .book-3d{width:clamp(130px,31vw,200px);height:clamp(205px,46vw,286px)}
}
@media(max-width:440px){
 .shelf-track{gap:24px 8px}
 .shelf-book{width:47%;flex:0 1 47%}
 .shelf-book .book-3d{width:clamp(122px,34vw,150px);height:clamp(190px,50vw,229px)}
}

/* Reference-matched hover motion: three fanned 3D books, no backing cards. */
#shelf-track{
  perspective:1650px;
  perspective-origin:50% 45%;
  isolation:isolate;
  overflow:visible;
}
#shelf-track .shelf-book{
  --rest-y:0deg;
  --rest-z:0deg;
  position:relative;
  z-index:1;
  background:transparent;
  box-shadow:none;
  border:0;
  overflow:visible;
  isolation:auto;
  transition:z-index 0s;
}
#shelf-track .shelf-book:nth-child(1){--rest-y:-13deg;--rest-z:-6deg;z-index:1}
#shelf-track .shelf-book:nth-child(2){--rest-y:0deg;--rest-z:0deg;z-index:2}
#shelf-track .shelf-book:nth-child(3){--rest-y:13deg;--rest-z:6deg;z-index:1}
#shelf-track .shelf-book:nth-child(2) .book-3d{width:clamp(155px,18vw,213px);height:clamp(240px,27vw,320px)}
#shelf-track .shelf-book .book-3d,
#shelf-track .shelf-book:nth-child(2) .book-3d,
#shelf-track .shelf-book:nth-child(3) .book-3d{
  transform:perspective(1100px) rotateY(var(--rest-y)) rotateZ(var(--rest-z)) translate3d(0,0,0);
  transform-origin:center center;
  transform-style:preserve-3d;
  transition:transform .72s cubic-bezier(.22,1,.36,1),filter .72s cubic-bezier(.22,1,.36,1);
  filter:drop-shadow(12px 16px 10px #02050b9c);
  will-change:transform;
}
#shelf-track .shelf-book:is(:hover,:focus-visible){z-index:10}
#shelf-track .shelf-book:is(:hover,:focus-visible) .book-3d,
#shelf-track .shelf-book:nth-child(2):is(:hover,:focus-visible) .book-3d,
#shelf-track .shelf-book:nth-child(3):is(:hover,:focus-visible) .book-3d{
  transform:perspective(1100px) translate3d(0,-19px,36px) rotateY(var(--hover-y,0deg)) rotateX(var(--hover-x,0deg)) rotateZ(0deg) scale(1.065);
  filter:drop-shadow(18px 26px 15px #02050bc9);
}
#shelf-track .shelf-book:is(:hover,:focus-visible) .book-spine{
  transition:opacity .35s;
  opacity:.9;
}
/* The paper OPEN tag sits on the cover — never on a rectangular background panel. */
#shelf-track .shelf-book .hover-open{
  position:absolute;
  left:50%;
  top:53%;
  display:grid;
  place-items:center;
  min-width:66px;
  min-height:33px;
  padding:8px 14px 7px;
  color:#282327;
  background:#f4ebd9;

/* SEAMLESS BOOK-TO-DETAIL TRANSITION.
   A single fixed 3D book travels between the cover's screen position and
   the detail view. Neither view can hide the travelling book midway. */
.book-transition-ghost{
 position:fixed;
 top:0;left:0;
 z-index:9998;
 pointer-events:none;
 transform-style:preserve-3d;
 transform-origin:center center;
 perspective:1400px;
 will-change:left,top,width,height,transform;
 /* Avoid a parent filter: it would flatten the book's 3D front/back. */
}
.book-transition-ghost .display-cover{
 position:absolute;
 inset:0;
 transform:translateZ(18px)!important;
 backface-visibility:hidden!important;
 overflow:hidden;
}
.book-transition-ghost .display-cover .ct h1{
 font-size:var(--flight-title-size,2.5rem)!important;
}
.book-transition-ghost .ghost-back{
 position:absolute;inset:0;
 transform:rotateY(180deg) translateZ(18px);
 backface-visibility:hidden;
 background:linear-gradient(135deg,#523239,#24191f 60%,#150f16);
 border:3px double #b9a17d;
}
.book-transition-ghost .ghost-spine,
.book-transition-ghost .ghost-edges{
 position:absolute;top:0;height:100%;width:36px;
 backface-visibility:hidden;
 pointer-events:none;
}
.book-transition-ghost .ghost-spine{
 left:-18px;transform:rotateY(-90deg);
 background:linear-gradient(90deg,#21141a,#815348 35%,#3e272d 78%,#130f14);
 border:1px solid #86644f;
}
.book-transition-ghost .ghost-edges{
 right:-18px;transform:rotateY(90deg);
 background:repeating-linear-gradient(0deg,#f0e6d3 0 2px,#c6b49c 2px 3px,#eee1cd 3px 5px);
 border:1px solid #b6a188;
}
.scene.is-opening .shelf-view{
 opacity:1!important;
 transform:none!important;
 pointer-events:none;
 transition:none!important;
}
.scene.is-opening .shelf-book.is-chosen,
.scene.is-returning .shelf-book.is-chosen{
 visibility:hidden!important;
}
.scene.is-opening .shelf-book:not(.is-chosen){
 animation:otherBooksLeave .84s cubic-bezier(.45,.02,.53,.98) both;
}
.scene.is-opening .shelf-book:nth-child(3):not(.is-chosen){animation-delay:.08s}
@keyframes otherBooksLeave{
 0%{opacity:1;transform:translate3d(0,0,0) rotateZ(0)}
 25%{opacity:1;transform:translate3d(0,-24px,22px) rotateZ(-2deg)}
 100%{opacity:0;transform:translate3d(0,85vh,-80px) rotateZ(-13deg)}
}
.scene.is-opening .shelf-title,
.scene.is-opening .shelf-head{opacity:0;transition:opacity .35s ease!important}
.scene.is-returning .shelf-view{
 opacity:1!important;
 visibility:visible!important;
 transform:none!important;
 transition:none!important;
 pointer-events:none;
}
.scene.is-returning .detail-view{
 opacity:0!important;
 visibility:hidden!important;
 transition:none!important;
 pointer-events:none!important;
}
.scene.is-returning .shelf-book:not(.is-chosen){
 animation:otherBooksReturn .95s cubic-bezier(.18,.83,.27,1) both;
}
.scene.is-returning .shelf-book:nth-child(3):not(.is-chosen){animation-delay:.08s}
@keyframes otherBooksReturn{
 0%{opacity:0;transform:translate3d(0,68vh,-80px) rotateZ(-12deg)}
 70%{opacity:1;transform:translate3d(0,-19px,15px) rotateZ(1deg)}
 100%{opacity:1;transform:translate3d(0,0,0) rotateZ(0)}
}
.scene.is-returning .shelf-title,
.scene.is-returning .shelf-head{
 animation:headerReturns .75s ease both;
}
@keyframes headerReturns{
 from{opacity:0;transform:translateY(-12px)}
 to{opacity:1;transform:translateY(0)}
}
/* Instant handoff: never reveal a second copy of the clicked book or
   leave an empty frame while the detail view fades in. The cover itself
   still animates on its hinge after the travelling book arrives. */
.scene.is-detail .shelf-view{
 opacity:0!important;
 visibility:hidden!important;
 transition:none!important;
 pointer-events:none!important;
}
.scene.is-detail .detail-view{
 opacity:1!important;
 visibility:visible!important;
 transform:translateY(0)!important;
 transition:none!important;
}
/* The front cover must visibly close BEFORE travelling back to the shelf. */
.scene.is-detail.is-closing .focus-cover-hinge{
 transform:rotateY(0deg)!important;
 transition:transform .62s cubic-bezier(.3,.05,.35,1)!important;
 transition-delay:0s!important;
}
.scene.is-detail.is-closing .focus-book{
 transform:rotateY(-8deg) rotateX(1deg)!important;
}
.scene.is-detail.is-closing .detail-text{
 opacity:0!important;
 transform:translateX(35px)!important;
 transition:opacity .25s ease,transform .35s ease!important;
}
.scene.is-detail.is-closing .close-detail{
 opacity:0;pointer-events:none;
}

   The hardcover rotates 360° by dragging, with inertia and a gentle hover.

.focus-stage{

.focus-stage::before{
 content:"";

 function flyBook(from,to,reverse,titleSize){

   offset

   frame(from,0,0,0,0),

 async function openDetail(i){

  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');

  function render(){
   leaves.forEach((leaf,i)=>{
    const f=clamp(pos-i,0,1);
    const folding=Math.sin(f*Math.PI);
    leaf.style.setProperty('--leaf-fold',folding.toFixed(3));
    leaf.style.transform='rotateY('+(-180*f).toFixed(3)+'deg)';
    leaf.style.zIndex=f>0&&f<1?count+5:f>=1?i+1:count-i;
    faces[i][0].style.visibility=f<.5?'visible':'hidden';
    faces[i][1].style.visibility=f>=.5?'visible':'hidden';
   });
   const shift=-25*(1-Math.min(1,pos))+25*Math.max(0,pos-(count-1));
   // Keep the original flat book layout; avoid a blank spread as the cover turns.
   pagesEl.style.transform='translateX('+shift.toFixed(2)+'%)';
   const insideSpread=Math.max(0,Math.min(1,(pos-1)*3,(count-1-pos)*3));
   pagesEl.style.setProperty('--spread',insideSpread.toFixed(3));
   $('#reader-count').textContent=pos<.1?'Front cover':pos>count-.1?'Back cover':'Pages '+Math.round(pos)+' of '+count;
   const percent=count?Math.round(pos/count*100):0;
   progress.setAttribute('aria-valuenow',String(percent));
   progressFill.style.width=percent+'%';
   $('#reader-prev').disabled=pos<=.01;
   $('#reader-next').disabled=pos>=count-.01;
  }
  function cancel(){if(frame)cancelAnimationFrame(frame);frame=0}
  function go(n){
   target=clamp(Math.round(n),0,count);cancel();
   if(reduce.matches){pos=target;render();return}
   const from=pos,to=target,started=performance.now(),duration=clamp(820+(Math.abs(to-from)-1)*130,540,1600);
   const tick=now=>{
    let x=clamp((now-started)/duration,0,1),e=x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
    pos=from+(to-from)*e;render();
    if(x<1)frame=requestAnimationFrame(tick);else{pos=to;render();frame=0}
   };
   frame=requestAnimationFrame(tick);
  }
  function pageClickDirection(e){
   const rect=stage.getBoundingClientRect();
   const x=(e.clientX-rect.left)/Math.max(1,rect.width);
   // The closed covers are centered in the reader; either side of a
   // visible cover should open/close it with the normal page-turn motion.
   if(target===0)return x>=.20&&x<=.80?1:0;
   if(target===count)return x>=.20&&x<=.80?-1:0;
   // In an open spread, clicking the right page turns forward and
   // clicking the left page turns back (not only the outer edges).
   return x>=0&&x<=1?(x<.5?-1:1):0;
  }
  stage.onpointerdown=e=>{
   if(e.button!==0||e.target.closest('button,a'))return;
   cancel();gesture={id:e.pointerId,x:e.clientX,base:Math.round(pos),moved:false};stage.setPointerCapture?.(e.pointerId);
  };
  stage.onpointermove=e=>{
   if(!gesture||gesture.id!==e.pointerId)return;
   const dx=e.clientX-gesture.x;if(Math.abs(dx)>7)gesture.moved=true;
   if(gesture.moved){pos=clamp(gesture.base-dx/Math.max(150,stage.clientWidth*.47),Math.max(0,gesture.base-1),Math.min(count,gesture.base+1));render()}
  };
  function finish(e){
   if(!gesture||gesture.id!==e.pointerId)return;
   const d=gesture;gesture=null;
   if(stage.hasPointerCapture?.(e.pointerId))stage.releasePointerCapture(e.pointerId);
   if(d.moved){skip=true;setTimeout(()=>skip=false,0);const diff=pos-d.base;go(d.base+(diff>.26?1:diff<-.26?-1:0))}
  }
  stage.onpointerup=finish;
  stage.onpointercancel=e=>{
   if(!gesture||gesture.id!==e.pointerId)return;
   const base=gesture.base;gesture=null;
   if(stage.hasPointerCapture?.(e.pointerId))stage.releasePointerCapture(e.pointerId);
   go(base);
  };
  stage.onclick=e=>{
   if(skip){skip=false;return}
   const button=e.target.closest('[data-reader-go]');
   if(button){go(+button.dataset.readerGo);return}
   if(e.target.closest('button,a,input,textarea,select'))return;
   const direction=pageClickDirection(e);
   if(direction)go(target+direction);
  };
  render();
  return {go,step:(delta)=>go(target+delta),stop:cancel};
 }
 function openReader(){
  if(reader)reader.stop();
  readerView.hidden=false;
  $('#reader-title').textContent=books[selected].title;
  reader=makeReader(books[selected]);
  clearBookFlight();
  scene.classList.remove('is-detail','is-arriving');
  void readerView.offsetWidth;
  resetFocusView(true);
  requestAnimationFrame(()=>scene.classList.add('is-reading'));

 function closeReader(){
  if(reader){reader.stop();reader=null}
  scene.classList.remove('is-reading');
  populateDetail();requestAnimationFrame(()=>{scene.classList.add('is-detail');startFocusView()});
  setTimeout(()=>{readerView.hidden=true},600);
 }
 // MOTION PORT from VengeanceUI's original Three.js BooksShowcase.
 // SPRING presets, spring integration, idle time/frequency, lift, hover tilt,
 // scale, pointer parallax and OPEN label spring use the source values.
 const TAU=Math.PI*2;
 const SPRING={
  POSITION:{k:17,d:6.8},
  TILT:{k:120,d:13},
  PARALLAX:{k:60,d:10},
  PILL:{k:190,d:23}
 };
 class Spring{
  constructor(v,preset){this.v=v;this.t=v;this.vel=0;this.k=preset.k;this.d=preset.d}
  set(v){this.v=v;this.t=v;this.vel=0;return this}
  update(dt){const a=this.k*(this.t-this.v)-this.d*this.vel;this.vel+=a*dt;this.v+=this.vel*dt;return this.v}
 }
 const cm=(v,a,b)=>Math.max(a,Math.min(b,v));
 const motionReduce=window.matchMedia('(prefers-reduced-motion: reduce)');
 const motionRoot=$('#showcase');
 const motionTrack=$('#shelf-track');
 const motionBooks=[...document.querySelectorAll('#shelf-track .shelf-book')].map((card,i)=>{
  const shape=card.querySelector('.book-3d'),wrapper=card.querySelector('.idle-float');
  const pp=shape.offsetHeight/(2.14*(i===1?1.32:1.22));
  // Restore the original shelf poses: left tilted left, center facing
  // straight forward and slightly raised, right tilted right.
  // Keep the VengeanceUI idle/hover spring animation unchanged.
  const angles=[
   {rx:-Math.PI/60,ry:-26*Math.PI/180,rz:-4*Math.PI/180},
   {rx:0,ry:0,rz:0},
   {rx:-Math.PI/60,ry:26*Math.PI/180,rz:4*Math.PI/180}
  ][i];
  return {
   card,shape,wrapper,
   phase:Math.random()*TAU,ppu:pp,angles,
   tiltX:new Spring(0,SPRING.TILT),
   tiltY:new Spring(0,SPRING.TILT),
   lift:new Spring(0,SPRING.TILT),
   scale:new Spring(1,SPRING.POSITION),
   // Same lower-to-slot entrance as the reference: 240ms stagger.
   entrance:new Spring(-3.9,SPRING.POSITION),
   entered:false,enterAt:performance.now()+240+i*150
  };
 });

 const cursorOpen=document.createElement('span');
 cursorOpen.className='cursor-open-tag';
 cursorOpen.textContent='OPEN';
 cursorOpen.setAttribute('aria-hidden','true');
 document.body.append(cursorOpen);
 const pillX=new Spring(0,SPRING.PILL);
 const pillY=new Spring(0,SPRING.PILL);
 const parX=new Spring(0,SPRING.PARALLAX);
 const parY=new Spring(0,SPRING.PARALLAX);
 let cursorBook=null,pointerX=0,pointerY=0,knownPointer=false,manualHover=false;
 function placeOpenCursor(book,x,y){
  const start=!cursorBook;
  cursorBook=book;pointerX=x;pointerY=y;knownPointer=true;
  if(start){pillX.set(x);pillY.set(y+34)}
  cursorOpen.classList.add('is-visible');
 }
 function hideOpenCursor(book){
  if(book&&cursorBook!==book)return;
  cursorBook=null;cursorOpen.classList.remove('is-visible');
 }
 motionBooks.forEach(book=>{
  const {card,shape}=book;
  // Hover is attached to the real cover, never the empty card area.
  shape.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')placeOpenCursor(book,e.clientX,e.clientY)});
  shape.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')placeOpenCursor(book,e.clientX,e.clientY)});
  shape.addEventListener('pointerleave',()=>hideOpenCursor(book));
  shape.addEventListener('pointercancel',()=>hideOpenCursor(book));
  card.addEventListener('pointerleave',()=>hideOpenCursor(book));
  card.addEventListener('focus',()=>{
   if(!card.matches(':focus-visible'))return;
   const rect=shape.getBoundingClientRect();
   placeOpenCursor(book,rect.left+rect.width/2,rect.top+rect.height/2);
  });
  card.addEventListener('blur',()=>hideOpenCursor(book));
 });
 motionRoot.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  pointerX=e.clientX;pointerY=e.clientY;knownPointer=true;
 },{passive:true});
 motionRoot.addEventListener('pointerleave',()=>{
  knownPointer=false;hideOpenCursor();
 });
 window.addEventListener('scroll',()=>hideOpenCursor(),{passive:true});
 window.addEventListener('blur',()=>hideOpenCursor());
 // Frame update mirrors the source's 30 fps physics time step.
 let motionFrame=0,lastMotion=0,elapsedMotion=0,isInViewport=true;
 const frameInterval=1000/30;
 const motionObserver=new IntersectionObserver(entries=>{
  isInViewport=entries[0]?.isIntersecting??true;
  if(isInViewport&&!motionFrame)motionFrame=requestAnimationFrame(animateBooks);
 },{rootMargin:'160px'});
 motionObserver.observe(motionRoot);
 function animateBooks(now){
  motionFrame=0;
  if(document.hidden||!isInViewport){lastMotion=0;return}
  if(!lastMotion)lastMotion=now-frameInterval;
  const diff=now-lastMotion;
  if(diff<frameInterval-1){motionFrame=requestAnimationFrame(animateBooks);return}
  lastMotion=now;
  const dt=Math.min(diff/1000,.05);
  elapsedMotion+=dt;
  const t=elapsedMotion;
  const reduced=motionReduce.matches;
  const w=Math.max(1,motionRoot.clientWidth),h=Math.max(1,motionRoot.clientHeight);
  const box=motionRoot.getBoundingClientRect();
  const ndcX=knownPointer?cm((pointerX-box.left)/w*2-1,-1,1):0;
  const ndcY=knownPointer?cm(-((pointerY-box.top)/h*2-1),-1,1):0;
  parX.t=reduced?0:ndcX*.02;
  parY.t=reduced?0:-ndcY*.012;
  motionTrack.style.setProperty('transform','rotateY('+parX.update(dt)+'rad) rotateX('+parY.update(dt)+'rad)','important');
  motionBooks.forEach(book=>{
   const {shape,wrapper,angles}=book;
   const isHovered=cursorBook===book&&scene.classList.contains('is-detail')===false&&scene.classList.contains('is-reading')===false;
   if(!book.entered&&now>=book.enterAt){book.entered=true;book.entrance.t=0}
   if(reduced){book.entrance.set(0)}
   const rect=shape.getBoundingClientRect();
   const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
   // Original normalized pointer math + clamps from tickBook().
   const dxN=(pointerX-x)/(w*.25);
   const dyN=(y-pointerY)/(h*.3);
   book.tiltY.t=isHovered?cm(dxN*.28,-.15,.15):0;
   book.tiltX.t=isHovered?cm(-dyN*.1,-.09,.1):0;
   book.lift.t=isHovered?.3:0;
   book.scale.t=isHovered?1.09:1;
   const tiltY=book.tiltY.update(dt);
   const tiltX=book.tiltX.update(dt);
   const lift=book.lift.update(dt);
   const scale=book.scale.update(dt);
   const drop=book.entrance.update(dt);
   const ppu=shape.offsetHeight/(2.14*(book===motionBooks[1]?1.32:1.22));
   book.ppu=ppu;
   // Original source:
   // b.float.position.y = sin(t*.7 + phase)*.035
   // b.float.rotation.z = sin(t*.9 + phase*1.7)*.006
   const fy=reduced?0:Math.sin(t*.7+book.phase)*.035*ppu;
   const fz=reduced?0:Math.sin(t*.9+book.phase*1.7)*.006;
   wrapper.style.setProperty('transform','translate3d(0,'+fy.toFixed(3)+'px,0) rotateZ('+fz.toFixed(6)+'rad)','important');
   const baseY=book===motionBooks[1]?-10:0;
   const baseZ=book===motionBooks[1]?22:0;
   shape.style.setProperty('transform',
    'perspective(1400px) translate3d(0,'+(baseY+(drop+lift)*ppu).toFixed(3)+'px,'+baseZ+'px) '+
    'rotateX('+(angles.rx+tiltX).toFixed(6)+'rad) '+
    'rotateY('+(angles.ry+tiltY).toFixed(6)+'rad) '+
    'rotateZ('+angles.rz.toFixed(6)+'rad) scale('+scale.toFixed(5)+')','important');
  });
  if(cursorBook){
   const tx=pointerX,ty=pointerY+34;
   pillX.t=tx;pillY.t=ty;
   cursorOpen.style.transform='translate3d('+pillX.update(dt).toFixed(2)+'px,'+pillY.update(dt).toFixed(2)+'px,0) translate(-50%,-50%) rotate(-1.6deg)';
  }
  motionFrame=requestAnimationFrame(animateBooks);
 }
 motionFrame=requestAnimationFrame(animateBooks);
 document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&!motionFrame)motionFrame=requestAnimationFrame(animateBooks);
 });
 $('#shelf-track').addEventListener('click',e=>{
  const card=e.target.closest('[data-select]');if(card)openDetail(+card.dataset.select);
 });
 $('#detail-close').addEventListener('click',returnShelf);
 $('#detail-prev').addEventListener('click',()=>switchDetail(-1));
 $('#detail-next').addEventListener('click',()=>switchDetail(1));
 $('#detail-read').addEventListener('click',openReader);

 // Reader navigation keeps its own current position, not the displayed label.
 $('#reader-prev').onclick=()=>reader?.step(-1);
 $('#reader-next').onclick=()=>reader?.step(1);
 document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(e.key==='Escape'){if(scene.classList.contains('is-reading'))closeReader();else if(scene.classList.contains('is-detail'))returnShelf()}
  else if(scene.classList.contains('is-reading')&&reader){if(e.key==='ArrowRight'){e.preventDefault();reader.step(1)}else if(e.key==='ArrowLeft'){e.preventDefault();reader.step(-1)}}
  else if(scene.classList.contains('is-detail')){if(e.key==='ArrowRight')switchDetail(1);else if(e.key==='ArrowLeft')switchDetail(-1)}
 });
 markSelected();
